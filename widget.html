<!--
  AC Tactical HUD v1.2.0 – Raid Mode
  StreamElements Custom Widget
  Canvas: 800 × 320
-->
<div class="ac-widget">
  <div class="ac-alert" data-type="follow" aria-live="polite">
    <div class="ac-corners" aria-hidden="true">
      <span class="ac-corner ac-corner-tl"></span>
      <span class="ac-corner ac-corner-tr"></span>
      <span class="ac-corner ac-corner-bl"></span>
      <span class="ac-corner ac-corner-br"></span>
    </div>

    <div class="ac-effects" aria-hidden="true">
      <div class="ac-grid"></div>
      <div class="ac-scan"></div>
      <div class="ac-scan ac-scan-two"></div>
      <div class="ac-raid-afterglow"></div>
    </div>

    <header class="ac-header">
      <div class="ac-segments ac-segments-left">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="ac-logo">
        <div class="ac-logo-ring"></div>
        <div class="ac-logo-flash"></div>
        <img
          id="acLogo"
          src="https://raw.githubusercontent.com/ehenry0316/stream-assets/main/Generated%20image%201%20(4).png"
          alt="Allison Chaynez logo"
        >
      </div>

      <div class="ac-segments ac-segments-right">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <main class="ac-content">
      <div class="ac-network">AC NETWORK // EVENT DETECTED</div>
      <div class="alert-header">NEW RAIDER</div>
      <div class="alert-message">
        Welcome aboard,
        <span id="username">{{name}}</span>
      </div>
    </main>

    <div class="ac-divider">
      <div class="ac-divider-glow"></div>
    </div>

    <footer class="ac-footer">
      <div>AC // ACTIVE</div>
      <div class="ac-online">
        <span class="ac-led"></span>
        <span>ONLINE</span>
      </div>
      <div>CHAYNEZ GANG // 001</div>
    </footer>

    <div class="ac-progress-row">
      <div class="ac-progress">
        <div class="ac-progress-fill"></div>
        <div class="ac-progress-charge"></div>
        <div class="ac-progress-confirm"></div>
      </div>
      <div id="eventCode" class="ac-event-code">FLW-001</div>
    </div>
  </div>
</div>
